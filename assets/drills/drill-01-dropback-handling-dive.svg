<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd21f"/></marker>
  </defs>
  <rect width="600" height="520" fill="#2e7d3a"/>
  <g fill="#348a41"><rect y="0" width="600" height="65"/><rect y="130" width="600" height="65"/><rect y="260" width="600" height="65"/></g>
  <g fill="none" stroke="#fff" stroke-width="3"><rect x="40" y="40" width="520" height="300"/><rect x="150" y="40" width="300" height="110"/></g>
  <rect x="230" y="18" width="140" height="22" fill="#e9f3ea" stroke="#fff" stroke-width="3"/>
  <path d="M230,29 H370 M250,18 V40 M270,18 V40 M290,18 V40 M310,18 V40 M330,18 V40 M350,18 V40" stroke="#9db8a0" stroke-width="1"/>

  <g fill="#ff8a00" stroke="#7a3f00" stroke-width="2">
    <polygon points="235,205 250,180 265,205"/><polygon points="335,205 350,180 365,205"/>
  </g>

  <!-- GK positions: start (full), after drop back and after return (faded) -->
  <g stroke="#0b0c0d" stroke-width="2">
    <circle cx="340" cy="115" r="17" fill="#ffd21f"/>
    <circle cx="255" cy="72" r="15" fill="#ffd21f" fill-opacity="0.45" stroke-dasharray="4 3"/>
    <circle cx="300" cy="168" r="15" fill="#ffd21f" fill-opacity="0.45" stroke-dasharray="4 3"/>
    <circle cx="90" cy="300" r="15" fill="#3b82f6"/>
    <circle cx="510" cy="300" r="15" fill="#3b82f6"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#0b0c0d">
    <text x="340" y="120">ح</text><text x="255" y="77">ح</text><text x="300" y="173">ح</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#fff"><text x="90" y="305">م1</text><text x="510" y="305">م2</text></g>
  <g fill="#fff" stroke="#0b0c0d" stroke-width="2"><circle cx="112" cy="282" r="7"/><circle cx="488" cy="282" r="7"/></g>

  <!-- 1: high ball (dashed white) + GK drops back toward goal (yellow) -->
  <path d="M112,278 Q140,110 228,62" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <path d="M328,100 L275,74" fill="none" stroke="#ffd21f" stroke-width="3" marker-end="url(#ay)"/>
  <!-- 2: GK returns between cones -->
  <path d="M252,90 Q248,135 290,158" fill="none" stroke="#ffd21f" stroke-width="3" marker-end="url(#ay)"/>
  <!-- 3: low ball (solid white) + short dive (yellow dotted) -->
  <path d="M488,282 L408,190" fill="none" stroke="#fff" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M316,160 Q355,140 392,176" fill="none" stroke="#ffd21f" stroke-width="3" stroke-dasharray="3 6" marker-end="url(#ay)"/>

  <g stroke="#0b0c0d" stroke-width="2">
    <circle cx="158" cy="140" r="14" fill="#e11d48"/>
    <circle cx="232" cy="125" r="14" fill="#e11d48"/>
    <circle cx="447" cy="235" r="14" fill="#e11d48"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#fff"><text x="158" y="145">1</text><text x="232" y="130">2</text><text x="447" y="240">3</text></g>

  <g id="wm-diag" opacity="0.11" fill="#fff" font-family="Tahoma, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle"><text transform="translate(150,290) rotate(-18)">GK ELITE 3IN1 • بن عبدالله الهواري</text><text transform="translate(450,200) rotate(-18)">GK ELITE 3IN1 • بن عبدالله الهواري</text><text transform="translate(190,150) rotate(-18)">GK ELITE 3IN1 • بن عبدالله الهواري</text></g><rect x="0" y="365" width="600" height="155" fill="#0b0c0d"/>
  <g font-size="15" fill="#fff" text-anchor="end">
    <text x="580" y="392" font-weight="bold" fill="#ffd21f">تمرين: التراجع ومسك الكرة والارتماء القصير</text>
    <text x="580" y="420">١  م1 يرسل كرة عالية، والحارس يتراجع نحو المرمى ويلتقطها</text>
    <text x="580" y="446">٢  يعود الحارس بين القمعين ويجهّز نفسه</text>
    <text x="580" y="472">٣  م2 يدحرج كرة أرضية، والحارس يرتمي ارتماءً قصيرًا ويمسكها</text>
    <text x="580" y="500" font-size="13" fill="#9ca3af">ح: الحارس (الدائرة الباهتة = موضعه بعد الحركة)  |  خط أبيض متقطع: كرة عالية  |  خط أبيض متصل: كرة أرضية</text>
  </g>
<g id="wm-badge"><clipPath id="wmc"><circle cx="24" cy="21" r="16"/></clipPath><image x="8" y="5" width="32" height="32" href="data:image/jpeg;base64," clip-path="url(#wmc)"/><circle cx="24" cy="21" r="16" fill="none" stroke="#ffd21f" stroke-width="2"/><text x="46" y="18" font-size="11" font-weight="bold" fill="#fff" font-family="Tahoma, Arial, sans-serif">GK ELITE 3IN1 🇩🇿</text><text x="46" y="32" font-size="11" fill="#ffd21f" font-family="Tahoma, Arial, sans-serif">بن عبدالله الهواري</text></g></svg>